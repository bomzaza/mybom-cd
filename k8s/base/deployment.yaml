apiVersion: apps/v1
kind: Deployment
metadata:
  name: mybom
  labels:
    app.kubernetes.io/name: mybom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mybom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mybom
    spec:
      containers:
        - name: mybom
          image: ghcr.io/REPLACE_ME/mybom:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi